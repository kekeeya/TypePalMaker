# Publishes the web Maker to GitHub Pages, with the signed pet template it
# builds apps from, once every test has passed.
name: Pages

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".github/readme/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # The Windows pet: tested, and its template kept for the web Maker.
  windows:
    uses: ./.github/workflows/windows.yml

  build:
    needs: [test, windows]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maker/package-lock.json

      - name: Pet template
        run: |
          player/build-app.sh
          archs=$(lipo -archs player/build/TypePal.app/Contents/MacOS/TypePal)
          echo "$archs"; [[ $archs == *x86_64* && $archs == *arm64* ]]

      - uses: actions/download-artifact@v8
        with:
          name: TypePal-windows
          path: ${{ runner.temp }}/windows

      - name: Web Maker
        working-directory: maker
        env:
          TYPEPAL_WIN_TEMPLATE: ${{ runner.temp }}/windows/out/TypePal.exe
        run: |
          npm ci
          npm run build
          test -s dist/template/TypePal
          test -s dist/template/windows/TypePal.exe

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: maker/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
