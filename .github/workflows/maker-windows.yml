# The Windows desktop Maker: one portable exe (the interface and the Windows
# pet template are inside it), zipped. Built on a Windows machine, unzipped
# elsewhere, opened and photographed. The zip is kept as an artifact (and the
# release attaches it, see release.yml).
name: Windows Maker

on:
  push:
    branches: [main, "dev_windows*"]
    paths: ["maker/**", "player-windows/**", ".github/workflows/maker-windows.yml"]
  workflow_dispatch:
  workflow_call:

jobs:
  maker:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Pet template
        working-directory: player-windows
        run: cargo build --release --bin TypePal

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maker/package-lock.json

      - name: Maker
        working-directory: maker
        run: |
          npm ci
          npm run tauri build
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }

      - name: Zip it
        run: |
          $version = (Get-Content maker\src-tauri\tauri.conf.json | ConvertFrom-Json).version
          $stage = "$env:RUNNER_TEMP\stage"
          New-Item -ItemType Directory -Force $stage, "$env:RUNNER_TEMP\out" | Out-Null
          Copy-Item maker\src-tauri\target\release\typepal-maker.exe "$stage\TypePalMaker.exe"
          $zip = "$env:RUNNER_TEMP\out\TypePalMaker-$version-windows.zip"
          Compress-Archive -Path "$stage\TypePalMaker.exe" -DestinationPath $zip
          "{0}: {1:N1} MB" -f (Split-Path $zip -Leaf), ((Get-Item $zip).Length / 1MB)
          "ZIP=$zip" >> $env:GITHUB_ENV


      # Nothing beyond what every Windows has: no Visual C++ runtime DLLs.
      - name: Needs nothing extra
        run: |
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin /nologo /dependents "$env:RUNNER_TEMP\stage\TypePalMaker.exe"
          $deps
          $extra = $deps | Select-String -Pattern "vcruntime|msvcp|api-ms-win-crt|ucrtbase"
          if ($extra) { throw "still needs: $extra" }

      - name: Unzip and open it
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\out" | Out-Null
            $bmp.Save("$env:RUNNER_TEMP\out\$name.png")
          }
          # Somewhere else entirely, as a user would put it.
          $dir = "$env:RUNNER_TEMP\unzipped"
          Expand-Archive $env:ZIP -DestinationPath $dir
          # The exe's own icon, as Explorer and the taskbar show it.
          [System.Drawing.Icon]::ExtractAssociatedIcon("$dir\TypePalMaker.exe").ToBitmap().Save("$env:RUNNER_TEMP\out\maker-icon.png")
          $p = Start-Process "$dir\TypePalMaker.exe" -PassThru
          Start-Sleep 15
          if ($p.HasExited) { throw "the Maker quit with $($p.ExitCode)" }
          Shot maker
          Stop-Process -Id $p.Id

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: TypePalMaker-windows
          path: ${{ runner.temp }}\out\*
