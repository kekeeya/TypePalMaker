# The Windows pet, on a Windows machine: its tests (the settings window drawn
# with Windows' own fonts among them), the template exe, the built-in mascot
# packed into it, and the mascot launched and photographed. Everything made is
# kept as an artifact, to copy to a real PC and try.
name: Windows

on:
  push:
    branches: [main, "dev_*"]
    paths: ["player-windows/**", "maker/src/model/appBuild/**", "maker/public/assets/typepal-frames/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["player-windows/**", "maker/src/model/appBuild/**", "maker/public/assets/typepal-frames/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
  workflow_call:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Tests
        working-directory: player-windows
        env:
          TYPEPAL_UI_OUT: ${{ runner.temp }}\ui
        run: cargo test

      - name: Template
        working-directory: player-windows
        run: |
          cargo build --release
          "{0:N0} KB" -f ((Get-Item target\release\TypePal.exe).Length / 1KB)


      # Nothing beyond what every Windows 10 and 11 has: no Visual C++
      # runtime DLLs. (api-ms-win-crt-*, the Universal C Runtime, is part of
      # Windows itself since 10.)
      - name: Needs nothing extra
        run: |
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin /nologo /dependents "player-windows\target\release\TypePal.exe"
          $deps
          $extra = $deps | Select-String -Pattern "vcruntime|msvcp|concrt"
          if ($extra) { throw "still needs: $extra" }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maker/package-lock.json

      # The web Maker's generator, run on the real template; the runtime then
      # reads what it made.
      - name: A pet from the web Maker
        env:
          TYPEPAL_WIN_TEMPLATE: ${{ github.workspace }}\player-windows\target\release\TypePal.exe
          TYPEPAL_SMOKE_DIR: ${{ runner.temp }}\out
        run: |
          Push-Location maker
          npm ci
          npx vitest run src/model/appBuild/buildWindows.test.ts
          Pop-Location
          if (-not (Test-Path "$env:RUNNER_TEMP\out\web.exe")) { throw "the web Maker made no pet" }
          Push-Location player-windows
          $env:TYPEPAL_WEB_EXE = "$env:RUNNER_TEMP\out\web.exe"
          cargo test --test mascot
          Pop-Location

      - name: Pack the mascot
        run: |
          $out = "$env:RUNNER_TEMP\out"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item player-windows\target\release\TypePal.exe "$out\TypePal.exe"
          & player-windows\target\release\typepal-pack.exe "$out\TypePal.exe" --mascot maker\public\assets\typepal-frames "$out\TypePal 小团子.exe"
          if ($LASTEXITCODE -ne 0) { throw "packing failed" }
          Get-ChildItem $out | Format-Table Name, Length

      - name: Run it
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\shots" | Out-Null
            $bmp.Save("$env:RUNNER_TEMP\shots\$name.png")
          }
          $exe = "$env:RUNNER_TEMP\out\TypePal 小团子.exe"
          $pet = Start-Process $exe -PassThru
          Start-Sleep 6
          if ($pet.HasExited) { throw "the pet quit with $($pet.ExitCode)" }
          Shot pet
          # Launching it again opens the running pet's settings.
          Start-Process $exe
          Start-Sleep 4
          if ($pet.HasExited) { throw "the pet quit with $($pet.ExitCode)" }
          Shot settings
          $p = Get-Process -Id $pet.Id
          "{0:N1} MB working set, {1:N2} s CPU" -f ($p.WorkingSet64 / 1MB), $p.CPU
          Stop-Process -Id $pet.Id

          # The pet the web Maker made runs too.
          $web = Start-Process "$env:RUNNER_TEMP\out\web.exe" -PassThru
          Start-Sleep 6
          if ($web.HasExited) { throw "the web Maker's pet quit with $($web.ExitCode)" }
          Shot web
          Stop-Process -Id $web.Id

      # Days of running, compressed: settings opened and closed again and again,
      # a minute of the pointer sweeping over the pet with keys pressed, then
      # rest. Memory, handles and GDI objects must stay flat, and an idle pet
      # must cost next to no CPU.
      - name: Long run
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -TypeDefinition @"
          using System; using System.Runtime.InteropServices;
          public static class W {
            [DllImport("user32.dll")] public static extern uint GetGuiResources(IntPtr process, uint flags);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindow(string cls, string title);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr hwnd, uint msg, IntPtr w, IntPtr l);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra);
          }
          "@
          $exe = "$env:RUNNER_TEMP\out\TypePal 小团子.exe"
          $pet = Start-Process $exe -PassThru
          Start-Sleep 5
          function Sample($when) {
            $p = Get-Process -Id $pet.Id
            [pscustomobject]@{
              when = $when
              privateMB = [math]::Round($p.PrivateMemorySize64 / 1MB, 1)
              workingMB = [math]::Round($p.WorkingSet64 / 1MB, 1)
              handles = $p.HandleCount
              gdi = [W]::GetGuiResources($p.Handle, 0)
              user = [W]::GetGuiResources($p.Handle, 1)
              cpuS = [math]::Round($p.TotalProcessorTime.TotalSeconds, 2)
            }
          }
          $start = Sample "started"
          for ($i = 0; $i -lt 10; $i++) {
            Start-Process $exe
            Start-Sleep 2
            $settings = [W]::FindWindow("TypePalSettings", $null)
            if ($settings -eq [IntPtr]::Zero) { throw "the settings window did not open" }
            [void][W]::PostMessage($settings, 0x10, [IntPtr]::Zero, [IntPtr]::Zero)
            Start-Sleep 1
          }
          $settings = Sample "settings opened and closed 10 times"
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea
          $end = (Get-Date).AddSeconds(60)
          $n = 0
          while ((Get-Date) -lt $end) {
            $x = $screen.Right - 150 + [int](60 * [math]::Sin($n / 3))
            [void][W]::SetCursorPos($x, $screen.Bottom - 100)
            if ($n % 20 -eq 0) { [W]::keybd_event(0x10, 0, 0, [UIntPtr]::Zero); [W]::keybd_event(0x10, 0, 2, [UIntPtr]::Zero) }
            $n++
            Start-Sleep -Milliseconds 30
          }
          $used = Sample "a minute of use"
          Start-Sleep 30
          $idle = Sample "30 s left alone"
          @($start, $settings, $used, $idle) | Format-Table -AutoSize
          Stop-Process -Id $pet.Id

          $grew = $idle.privateMB - $settings.privateMB
          $idleCpu = $idle.cpuS - $used.cpuS
          "memory after the first settings: +$grew MB; GDI +$($idle.gdi - $settings.gdi); USER +$($idle.user - $settings.user); handles +$($idle.handles - $settings.handles); idle CPU $idleCpu s in 30 s"
          if ($settings.privateMB -gt 80) { throw "too much memory with the settings used: $($settings.privateMB) MB" }
          if ($grew -gt 4) { throw "memory grew by $grew MB" }
          if ($idle.gdi - $settings.gdi -gt 5 -or $idle.user - $settings.user -gt 5) { throw "GDI or USER objects grew" }
          if ($idle.handles - $settings.handles -gt 30) { throw "handles grew" }
          if ($idleCpu -gt 0.6) { throw "an idle pet used $idleCpu s of CPU in 30 s" }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: TypePal-windows
          path: |
            ${{ runner.temp }}\out\*.exe
            ${{ runner.temp }}\shots\*.png
            ${{ runner.temp }}\ui\*.png
